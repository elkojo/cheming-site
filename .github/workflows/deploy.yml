# Builds the Astro site and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Live on the custom domain https://cheming.site (Phase 5, 2026-11-17).
# For a preview under elkojo.github.io/cheming-site/ use SITE_BASE: /cheming-site and SITE_URL: https://elkojo.github.io
env:
  SITE_BASE: /
  SITE_URL: https://cheming.site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
